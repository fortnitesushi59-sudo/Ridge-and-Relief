<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Ridge & Relief">
    <meta name="theme-color" content="#000000">
    <title>Ridge & Relief</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Leaflet.js Mapping Library (CSS & JS) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        :root {
            --bg-primary: #000000;
            --bg-surface: #111111;
            --bg-glass: rgba(18, 18, 18, 0.88);
            --accent: #FF5A36;
            --text-main: #FFFFFF;
            --text-muted: #888888;
            --border: rgba(255, 255, 255, 0.12);
            --safe-top: env(safe-area-inset-top, 44px);
            --safe-bottom: env(safe-area-inset-bottom, 24px);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-primary);
            color: var(--text-main);
            overflow: hidden;
            position: fixed;
        }

        /* Top Header */
        .app-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: calc(var(--safe-top) + 10px) 20px 20px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
            background: linear-gradient(to bottom, rgba(0,0,0,0.85) 10%, rgba(0,0,0,0.3) 60%, transparent);
            pointer-events: none;
        }

        .app-title { pointer-events: auto; }
        
        .app-title h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }

        .app-title p {
            font-size: 10px;
            color: var(--accent);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            cursor: pointer;
            pointer-events: auto;
            transition: transform 0.1s;
        }

        .icon-btn:active { transform: scale(0.92); }

        /* Map Container */
        #map {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            background: #111111;
        }

        /* High-contrast Bright Topo Map Filter */
        .dark-map {
            filter: invert(100%) hue-rotate(180deg) brightness(130%) contrast(90%);
        }

        .leaflet-control-attribution, .leaflet-control-zoom { display: none !important; }

        /* Floating Zoom & Map Controls */
        .map-controls {
            position: absolute;
            right: 16px;
            bottom: calc(var(--safe-bottom) + 135px);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 100;
            pointer-events: auto;
        }

        /* SLEEK COMPACT FLOATING BOTTOM CARD */
        .bottom-card {
            position: absolute;
            bottom: calc(var(--safe-bottom) + 12px);
            left: 16px;
            right: 16px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 16px 18px;
            z-index: 50;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .card-main-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .trail-titles {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .tag {
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .trail-name {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
        }

        .difficulty {
            font-size: 11px;
            font-weight: 700;
            padding: 5px 10px;
            border-radius: 14px;
            border: 1px solid var(--border);
        }

        .diff-Easy { color: #4ADE80; background: rgba(74, 222, 128, 0.12); border-color: rgba(74, 222, 128, 0.25); }
        .diff-Moderate { color: #FACC15; background: rgba(250, 204, 21, 0.12); border-color: rgba(250, 204, 21, 0.25); }
        .diff-Advanced { color: #F87171; background: rgba(248, 113, 113, 0.12); border-color: rgba(248, 113, 113, 0.25); }
        .diff-Expert { color: #A78BFA; background: rgba(167, 139, 250, 0.12); border-color: rgba(167, 139, 250, 0.25); }

        .card-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .inline-stats {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .inline-stats strong {
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
        }

        .dot {
            color: rgba(255, 255, 255, 0.2);
            font-size: 10px;
        }

        .btn-start {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 14px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.1s;
        }

        .btn-start:active { transform: scale(0.95); }

        /* Full Screen Trails Menu */
        .trails-modal {
            position: fixed;
            top: 100%;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-primary);
            z-index: 200;
            transition: top 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
            display: flex;
            flex-direction: column;
        }

        .trails-modal.open { top: 0; }

        .modal-header {
            padding: calc(var(--safe-top) + 20px) 20px 20px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border);
        }

        .modal-header h2 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; }

        .trails-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px 20px calc(var(--safe-bottom) + 20px) 20px;
        }

        .trail-row {
            padding: 20px 0;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        
        .trail-row:active { opacity: 0.5; }
        .trail-row h3 { font-size: 16px; margin-bottom: 4px; }
        .trail-row p { font-size: 13px; color: var(--text-muted); }

        /* Loading indicator for fetching route */
        .loading-text {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: var(--bg-glass);
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
            z-index: 150;
            backdrop-filter: blur(10px);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="app-title">
            <p>Hong Kong Topo</p>
            <h1>Ridge & Relief</h1>
        </div>
        <button class="icon-btn" id="openMenuBtn">
            <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="14" y2="18"/></svg>
        </button>
    </header>

    <div id="loadingText" class="loading-text">Mapping trail...</div>

    <!-- MAP CONTAINER -->
    <div id="map"></div>

    <div class="map-controls">
        <button class="icon-btn" id="zoomInBtn"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
        <button class="icon-btn" id="zoomOutBtn"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
        <button class="icon-btn" id="recenterBtn"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </div>

    <!-- COMPACT FLOATING CARD -->
    <div class="bottom-card">
        <div class="card-main-info">
            <div class="trail-titles">
                <span class="tag" id="uiTag">MacLehose Sec 1</span>
                <h2 class="trail-name" id="uiName">High Island Reservoir</h2>
            </div>
            <div class="difficulty diff-Easy" id="uiDifficulty">Easy</div>
        </div>
        <div class="card-action-bar">
            <div class="inline-stats">
                <span><strong id="uiDist">10.0 km</strong></span>
                <span class="dot">•</span>
                <span><strong id="uiTime">3h</strong></span>
                <span class="dot">•</span>
                <span><strong id="uiAscent">100 m</strong> ↑</span>
            </div>
            <button class="btn-start">
                <svg width="14" height="14" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                Start
            </button>
        </div>
    </div>

    <!-- Trails Menu -->
    <div class="trails-modal" id="trailsModal">
        <div class="modal-header">
            <h2>Select Route</h2>
            <button class="icon-btn" id="closeMenuBtn"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg></button>
        </div>
        <div class="trails-list" id="trailsList"></div>
    </div>

    <script>
        // --- 1. INITIALIZE MAP ---
        const map = L.map('map', { zoomControl: false }).setView([22.3986, 114.3323], 13);
        
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19,
            className: 'dark-map'
        }).addTo(map);

        let currentRouteLayer = null;
        const loadingText = document.getElementById('loadingText');

        // --- 2. HONG KONG TRAIL DATA ---
        const hkTrails = [
            { 
                name: "High Island Reservoir", tag: "MacLehose Sec 1", difficulty: "Easy", dist: "10.0 km", time: "3h", ascent: "100 m", 
                coords: [[22.399, 114.331], [22.385, 114.341], [22.378, 114.354], [22.355, 114.364]] 
            },
            { 
                name: "Lion Rock", tag: "Kowloon Peaks", difficulty: "Advanced", dist: "6.0 km", time: "3.5h", ascent: "450 m", 
                coords: [[22.345, 114.188], [22.350, 114.185], [22.352, 114.181], [22.355, 114.187]] 
            },
            { 
                name: "MacLehose Trail (Full)", tag: "Multi-Day Itinerary", difficulty: "Expert", dist: "100 km", time: "3-4 Days", ascent: "4,950 m", 
                coords: [[22.399, 114.331], [22.403, 114.281], [22.396, 114.259], [22.380, 114.200], [22.357, 114.152], [22.410, 114.110], [22.391, 113.974]] 
            },
            { 
                name: "Lamma Island Family Walk", tag: "Island Hike", difficulty: "Easy", dist: "4.0 km", time: "1.5h", ascent: "100 m", 
                coords: [[22.227, 114.113], [22.215, 114.125], [22.205, 114.131]] 
            },
            { 
                name: "Dragon's Back", tag: "Hong Kong Trail Sec 8", difficulty: "Moderate", dist: "8.5 km", time: "3h", ascent: "280 m", 
                coords: [[22.241, 114.239], [22.235, 114.243], [22.221, 114.248]] 
            },
            { 
                name: "Lantau Peak", tag: "Sunrise Hike", difficulty: "Advanced", dist: "7.0 km", time: "4h", ascent: "750 m", 
                coords: [[22.253, 113.940], [22.249, 113.931], [22.243, 113.918]] 
            }
        ];

        // --- 3. MENU LOGIC ---
        const trailsModal = document.getElementById('trailsModal');
        const trailsList = document.getElementById('trailsList');

        hkTrails.forEach((trail, index) => {
            const row = document.createElement('div');
            row.className = 'trail-row';
            row.innerHTML = `
                <div><h3>${trail.name}</h3><p>${trail.tag}</p></div>
                <div class="difficulty diff-${trail.difficulty}">${trail.difficulty}</div>
            `;
            row.onclick = () => loadTrail(index);
            trailsList.appendChild(row);
        });

        document.getElementById('openMenuBtn').onclick = () => trailsModal.classList.add('open');
        document.getElementById('closeMenuBtn').onclick = () => trailsModal.classList.remove('open');

        // --- 4. REAL TRAIL ROUTING (OSRM API) ---
        async function fetchRealTrailPath(coords) {
            const coordString = coords.map(c => `${c[1]},${c[0]}`).join(';');
            const url = `https://router.project-osrm.org/route/v1/foot/${coordString}?overview=full&geometries=geojson`;
            
            try {
                const response = await fetch(url);
                const data = await response.json();
                if (data.routes && data.routes.length > 0) {
                    return data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
                }
            } catch (error) {
                console.error("OSRM route fetch failed, using direct coordinates:", error);
            }
            return coords;
        }

        async function loadTrail(index) {
            const t = hkTrails[index];
            
            document.getElementById('uiName').textContent = t.name;
            document.getElementById('uiTag').textContent = t.tag;
            document.getElementById('uiDist').textContent = t.dist;
            document.getElementById('uiTime').textContent = t.time;
            document.getElementById('uiAscent').textContent = t.ascent;
            
            const diffEl = document.getElementById('uiDifficulty');
            diffEl.textContent = t.difficulty;
            diffEl.className = `difficulty diff-${t.difficulty}`;
            
            trailsModal.classList.remove('open');
            loadingText.style.display = 'block';

            const realPath = await fetchRealTrailPath(t.coords);
            loadingText.style.display = 'none';

            if (currentRouteLayer) map.removeLayer(currentRouteLayer);
            
            currentRouteLayer = L.polyline(realPath, {
                color: '#FF5A36',
                weight: 5,
                dashArray: '1, 8',
                lineCap: 'round',
                lineJoin: 'round'
            }).addTo(map);

            map.flyToBounds(currentRouteLayer.getBounds(), {
                paddingBottomRight: [0, 140],
                paddingTopLeft: [0, 50],
                duration: 1.5
            });
        }

        // --- 5. MAP BUTTON CONTROLS ---
        document.getElementById('zoomInBtn').onclick = () => map.zoomIn();
        document.getElementById('zoomOutBtn').onclick = () => map.zoomOut();
        document.getElementById('recenterBtn').onclick = () => {
            if (currentRouteLayer) {
                map.flyToBounds(currentRouteLayer.getBounds(), { paddingBottomRight: [0, 140], duration: 1 });
            }
        };

        // Initialize on load
        loadTrail(0);
    </script>
</body>
</html>
